server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing kullaniyor - bilinmeyen route'lar icin
    # index.html e dusuyor, gercek dosya/route ayrimini tarayiciya birakiyor
    location / {
        try_files $uri $uri/ /index.html;
    }
}