name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8 SDK kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Bağımlılıkları geri yükle
        run: dotnet restore OpenSight.sln

      - name: Derle
        run: dotnet build OpenSight.sln --no-restore --configuration Release

      - name: Testleri çalıştır
        run: dotnet test OpenSight.sln --no-build --configuration Release

  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları geri yükle
        run: pip install -r analysis-service/requirements.txt

      - name: Testleri çalıştır
        run: pytest analysis-service/tests