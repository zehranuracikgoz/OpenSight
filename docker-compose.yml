version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "OpenSight!2026"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    build:
      # context ./backend'e ayarli çünkü Dockerfile Domain/Application/Infrastructure/Api'nin
      # hepsini kopyalamak zorunda - bu 4 proje birbirine ProjectReference ile bagli
      context: ./backend
      dockerfile: src/OpenSight.Api/Dockerfile
    depends_on:
      - sqlserver
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__OpenSightDb: "Server=sqlserver,1433;Database=OpenSightDb;User Id=sa;Password=OpenSight!2026;TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"

  analysis-service:
    build:
      context: ./analysis-service
    depends_on:
      - rabbitmq
      - redis
      - ollama
      - api
    ports:
      - "8001:8001"
    environment:
      OPENSIGHT_API_URL: "http://api:8080"
      REDIS_HOST: "redis"
      RABBITMQ_HOST: "rabbitmq"
      OLLAMA_URL: "http://ollama:11434/api/generate"

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bunlari build sirasinda statik dosyalara gomuyor - tarayicida calisacagi icin
        # container-ici servis adlari degil, host'tan erisilebilir adresler olmali
        VITE_API_URL: "http://localhost:8080"
        VITE_ANALYSIS_SERVICE_URL: "http://localhost:8001"
    depends_on:
      - api
      - analysis-service
    ports:
      - "5173:80"

volumes:
  sqlserver-data:
  ollama-data: