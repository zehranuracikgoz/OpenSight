version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "OpenSight!2026"
      POSTGRES_DB: "OpenSightDb"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    build:
      # context ./backend'e ayarli çünkü Dockerfile Domain/Application/Infrastructure/Api'nin
      # hepsini kopyalamak zorunda - bu 4 proje birbirine ProjectReference ile bagli
      context: ./backend
      dockerfile: src/OpenSight.Api/Dockerfile
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__OpenSightDb: "Host=postgres;Port=5432;Database=OpenSightDb;Username=postgres;Password=OpenSight!2026"
      RabbitMQ__Uri: "amqp://rabbitmq"
      Cors__DashboardOrigin: "http://localhost:8090"

  analysis-service:
    build:
      context: ./analysis-service
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
      # ollama kasitli olarak burada yok - ExplanationGenerator zaten 3sn timeout + sablon
      # fallback ile calisiyor, ollama profili acilmadan analysis-service'in ayakta olmasi
      # gerekiyor (dusuk bellekli makinelerde varsayilan olarak kapali tutulabilsin diye)
    ports:
      - "8001:8001"
    environment:
      OPENSIGHT_API_URL: "http://api:8080"
      REDIS_HOST: "redis"
      RABBITMQ_HOST: "rabbitmq"
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "llama3.2:1b"
      DASHBOARD_ORIGIN: "http://localhost:8090"

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bunlari build sirasinda statik dosyalara gomuyor - tarayicida calisacagi icin
        # container-ici servis adlari degil, host'tan erisilebilir adresler olmali
        VITE_API_URL: "http://localhost:8080"
        VITE_ANALYSIS_SERVICE_URL: "http://localhost:8001"
    depends_on:
      - api
      - analysis-service
    ports:
      - "8090:80"

volumes:
  postgres-data:
  ollama-data: